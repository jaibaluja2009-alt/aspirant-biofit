<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioPulse Dashboard</title>
    
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }
        button:hover { background-color: #0051b3; }
        .toggle-text { margin-top: 16px; font-size: 14px; color: #666; cursor: pointer; }
        
        /* Dashboard Styling */
        #dashboard-screen { display: none; } /* Hidden by default */
        .welcome-msg { color: #222; font-size: 18px; margin-bottom: 20px; }
        .logout-btn { background-color: #ff3b30; }
        .logout-btn:hover { background-color: #d62217; }
    </style>
</head>
<body>

    <div class="container" id="auth-screen">
        <h2 id="form-title">Login to BioPulse</h2>
        <input type="email" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter your password" required>
        <button id="main-btn" onclick="handleAuth()">Login</button>
        <p class="toggle-text" id="toggle-link" onclick="toggleForm()">Don't have an account? Sign Up</p>
    </div>

    <div class="container" id="dashboard-screen">
        <h2>BioPulse Dashboard</h2>
        <p class="welcome-msg">Welcome back, <strong id="user-display-email">User</strong>! 👋</p>
        <div style="background: #eef2f3; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #555;">
            Your secure health and metrics application setup is now fully live.
        </div>
        <button class="logout-btn" onclick="handleLogout()">Log Out</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        // ⚠️ RE-PASTE YOUR UNIQUE FIREBASE CONFIG BLOCKS HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBQwfJcezlTQLeBDzStzSjULTpYqILNiag",
            authDomain: "aspirant-bio.firebaseapp.com",
            projectId: "aspirant-bio",
            storageBucket: "aspirant-bio.appspot.com",
            messagingSenderId: "776820415980",
            appId: "1:776820415980:web:966bae37c2e493c50db4c9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLoginMode = true;

        function toggleForm() {
            isLoginMode = !isLoginMode;
            document.getElementById('form-title').innerText = isLoginMode ? "Login to BioPulse" : "Create BioPulse Account";
            document.getElementById('main-btn').innerText = isLoginMode ? "Login" : "Sign Up";
            document.getElementById('toggle-link').innerText = isLoginMode ? "Don't have an account? Sign Up" : "Already have an account? Login";
        }

        // Monitor if a user is logged in or logged out
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in -> Show Dashboard, Hide Auth
                document.getElementById('user-display-email').innerText = user.email;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
            } else {
                // No user signed in -> Show Auth, Hide Dashboard
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please fill out all fields.');
                return;
            }

            if (isLoginMode) {
                auth.signInWithEmailAndPassword(email, password)
                    .catch((error) => { alert(error.message); });
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => { alert('Account Created Successfully!'); })
                    .catch((error) => { alert(error.message); });
            }
        }

        function handleLogout() {
            auth.signOut().then(() => {
                alert('Logged out successfully.');
            }).catch((error) => { alert(error.message); });
        }
    </script>
</body>
</html>
